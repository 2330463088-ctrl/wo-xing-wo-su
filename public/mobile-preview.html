    header{position:relative;justify-content:center}header .hint{display:none}.stages{padding:12px 11px 10px;overflow:hidden}.progress-nodes{position:relative;display:flex;justify-content:space-between;list-style:none;padding:0;margin:0}.progress-nodes:before{content:'';position:absolute;left:5%;right:5%;top:8px;height:1px;background:#d8e2e3}.progress-nodes li{z-index:1;width:12.5%;display:flex;flex-direction:column;align-items:center;gap:5px;color:#91a0a7;font-size:9px;white-space:nowrap}.progress-nodes i{width:15px;height:15px;border-radius:50%;border:1px solid #bdc9ca;background:#fff;display:grid;place-items:center;color:#fff;font-size:10px;font-style:normal}.progress-nodes li.done,.progress-nodes li.active{color:#1d2935;font-weight:650}.progress-nodes li.done i{background:#22313c;border-color:#22313c}.progress-nodes li.active i{background:#101820;border-color:#101820;box-shadow:0 0 0 3px #eaf0f0}.card{min-height:calc(100svh - 191px)}.content h2{text-align:center;margin-bottom:22px}.stages div{display:block}.area{padding-bottom:76px}.entry{width:100%;height:52px;border:1px solid #dce6e8;border-radius:10px;padding:0 14px;color:var(--ink);font:inherit;font-size:14px;outline:none}.entry:focus{border-color:#73aeb7;box-shadow:0 0 0 3px #e2f1f2}.input-wrap{position:relative;display:block;width:100%;overflow:hidden;border-radius:10px}.input-wrap .entry{position:relative;z-index:1}.scroll-hint{position:absolute;z-index:2;left:14px;right:14px;top:0;height:52px;line-height:52px;pointer-events:none;white-space:nowrap;color:#8a969f;animation:hint-scroll 8s linear infinite}.input-wrap:focus-within .scroll-hint{display:none}.input-wrap:has(.entry:not(:placeholder-shown)) .scroll-hint{display:none}@keyframes hint-scroll{0%,15%{transform:translateX(100%)}75%,100%{transform:translateX(-100%)}}.form-fields{display:grid;gap:13px}.form-fields label{display:grid;gap:7px;color:#546373;font-size:13px;font-weight:650}.evidence-picker{border:1px solid #dce7e9;border-radius:10px;overflow:     .repay-row{grid-template-columns:1fr!important}.date-wheel{border-radius:11px;background:#fff;padding:6px 8px 8px;border:1px solid #e1e9eb;position:relative}.wheel-column{min-width:0;text-align:center}.wheel-label{height:18px;line-height:18px;color:#2793b4;font-size:11px;margin-bottom:2px}.wheel-list{height:96px;overflow-y:auto;scroll-snap-type:y mandatory;padding:32px 0;scrollbar-width:none;position:relative}.wheel-list::-webkit-scrollbar{display:none}.wheel-column{position:relative}.wheel-column:before,.wheel-column:after{content:"";position:absolute;left:13%;right:13%;height:1px;background:#39a8d1;z-index:2}.wheel-column:before{top:54px}.wheel-column:after{top:83px}.wheel-item{height:30px;line-height:30px;scroll-snap-align:center;color:#a7b0b7;font-size:14px;border:0;background:transparent;width:100%;font:inherit}.wheel-item.selected{color:#1f2d3a;font-size:16px;font-weight:650}.repay-money{text-align:left!important}

<body><div class="app"><header><div class="brand"><span class="mark">诉</span><span>我行我诉</span></div><span class="hint" id="hint"></span></header>
  <section class="welcome" id="welcome"><div class="eyebrow">民事诉讼 · 分步指引</div><h1>把复杂的诉讼，<br>拆成清晰的每一步。</h1><p>从梳理情况、准备材料，到立案、开庭与执行，<br>我们将依据您的回答逐步提供行动建议。</p><button class="primary" onclick="start()">开始诉讼指导　→</button><div class="note">⌁ 每次只需回答一个问题，全程可随时返回修改</div></section>
  <section class="hidden" id="guide"><nav class="stages"><div id="journey"></div></nav><main class="area"><article class="card" id="card"></article></main></section>
</div><button class="human-service" type="button" onclick="humanService()">召唤真人服务</button><script>
const stageNames=['证据收集','文书撰写','递交立案','缴费通知','开庭通知','判决书解读','申请执行'];
const progressNames=['案件类型','证据收集','文书撰写','递交立案','缴费通知','开庭通知','判决书解读','申请执行'];
let queue=[],position=0,answers=[],selectedEvidence=[];
const input=(title,description,placeholder,stage=1,evidence=false)=>({kind:'input',title,description,placeholder,stage,evidence});
const form=(title,description,fields,stage=1,evidence=false)=>({kind:'form',title,description,fields,stage,evidence});
const repaymentList=(title,description,stage=1,evidence=false)=>({kind:'repaymentList',title,description,stage,evidence});
const rateInput=(title,description,stage=1,evidence=false)=>({kind:'rateInput',title,description,stage,evidence});
const choice=(title,description,options,stage=1)=>({kind:'choice',title,description,options,stage});
const note=(title,description,stage=1,action='继续')=>({kind:'note',title,description,stage,action});
const evidence=(name)=>({kind:'evidence',title:`请选择“${name}”的证据来源`,description:'可单选或多选，请选择与本项事实相对应的真实证据。',stage:1,sameStep:true});
const human=(reason)=>note('建议召唤人工协助',`${reason}。人工将协助您补齐信息或确认下一步。`,1,'联系人工');
function guarantorFlow(){return [
choice('担保签名写的是什么？','用于判断是否是真正的保证人。',[{label:'连带责任保证人',desc:'写明连带责任',add:[]},{label:'担保人或保证人',desc:'只写担保/保证',add:[]},{label:'见证人等',desc:'见证人/介绍人/经手人',add:[]},{label:'看不清',desc:'内容不确定',add:[]}]),
choice('借条是否写明连带责任？','没有写明时，一般不当然按连带保证处理。',[{label:'写了',desc:'有连带责任字样',add:[]},{label:'没写',desc:'没有连带责任字样',add:[]},{label:'不确定',desc:'需要核实原件',add:[]}]),
choice('是否还在保证期间内？','没约定时，通常按到期后6个月判断。',[{label:'是',desc:'仍在期间内',add:[]},{label:'可能超过',desc:'可能已超过期间',add:[]},{label:'不确定',desc:'需要核实日期',add:[]}]),
choice('是否向担保人催要过？','用于判断是否已向担保人主张权利。',[{label:'催要过，有证据',desc:'聊天/录音/短信等',add:[]},{label:'催要过，没证据',desc:'暂缺证明',add:[]},{label:'没有催要过',desc:'未向担保人主张',add:[]}]),
choice('借款人是否明显无法还款？','用于判断一般保证是否需要人工确认。',[{label:'是',desc:'无力还款或下落不明',add:[]},{label:'否',desc:'暂不能证明无力还款',add:[]},{label:'不确定',desc:'需要核实',add:[]}]),
note('担保人是否列为被告','系统将根据前面答案给出简短建议。',1,'继续')
]}
function jurisdictionFlow(){return [
choice('是否约定管辖法院？','优先看借条或聊天里有没有约定法院。',[{label:'有，直接填写',desc:'写明了具体法院',add:[input('请填写约定管辖法院','按证据中的法院名称填写。','例如：某某区人民法院',1),note('管辖法院判断','系统将给出简短管辖建议。',1,'继续')]},{label:'没有约定',desc:'继续判断法定管辖',add:[choice('是否知道被告所在地？','包括户籍地或经常居住地。',[{label:'知道，直接填写',desc:'我能提供被告所在地',add:[input('请填写被告所在地','填写被告户籍地或经常居住地。','例如：某省某市某区',1)]},{label:'不清楚',desc:'暂时无法确认',add:[]}]),input('请填写原告所在地','填写原告户籍地或经常居住地。','例如：某省某市某区',1),choice('借款还款方式是什么？','用于判断合同履行地线索。',[{label:'转账还款',desc:'银行或微信支付宝转账',add:[]},{label:'现金还款',desc:'线下现金交付',add:[]},{label:'没约定',desc:'没有明确还款方式',add:[]},{label:'不确定',desc:'需要核实',add:[]}]),note('管辖法院判断','系统将给出简短管辖建议。',1,'继续')]},{label:'不确定',desc:'需要人工确认',add:[human('管辖约定不清，需要核实借条或聊天记录')]}])
]}

function frontFold(text){
  return String(text||'').trim().replace(/[０-９]/g,char=>String.fromCharCode(char.charCodeAt(0)-65248)).replace(/[，．％（）－　Ｘｘ]/g,char=>({'，':',','．':'.','％':'%','（':'(','）':')','－':'-','　':' ','Ｘ':'X','ｘ':'X'}[char]||char)).toUpperCase();
}
function frontIdCandidate(text){
  const compact=frontFold(text).replace(/[\s\-_/]/g,'');

}
function frontMainlandIdValid(value){
  if(!/^\d{17}[\dX]$/.test(value))return false;
  const y=Number(value.slice(6,10)),m=Number(value.slice(10,12)),d=Number(value.slice(12,14));
  const date=new Date(y,m-1,d);
  if(date.getFullYear()!==y||date.getMonth()!==m-1||date.getDate()!==d)return false;
  const weights=[7,9,10,5,8,4,2,1,6,3,7,9,10,5,8,4,2],checks='10X98765432';
  const total=weights.reduce((sum,w,i)=>sum+Number(value[i])*w,0);
  return checks[total%11]===value[17];
}
function frontHkIdValid(value){
  const match=value.match(/^([A-Z]{1,2})(\d{6})\(?([0-9A])\)?$/);
  if(!match)return false;
  const letters=match[1],digits=match[2],check=match[3];
  const values=letters.length===1?[36,letters.charCodeAt(0)-55]:[letters.charCodeAt(0)-55,letters.charCodeAt(1)-55];
  values.push(...digits.split('').map(Number));
  const total=values.reduce((sum,v,i)=>sum+v*(9-i),0);
  const expected=(11-total%11)%11;
  return (expected===10?'A':String(expected))===check;
}
function frontTwIdValid(value){
  if(!/^[A-Z][1289]\d{8}$/.test(value))return false;
  const codes={A:10,B:11,C:12,D:13,E:14,F:15,G:16,H:17,I:34,J:18,K:19,L:20,M:21,N:22,O:35,P:23,Q:24,R:25,S:26,T:27,U:28,V:29,W:32,X:30,Y:31,Z:33};
  const code=codes[value[0]];
  const digits=[Math.floor(code/10),code%10,...value.slice(1).split('').map(Number)];
  const weights=[1,9,8,7,6,5,4,3,2,1,1];
  return digits.reduce((sum,digit,index)=>sum+digit*weights[index],0)%10===0;
}

  if(/^[A-Z][1289]\d{8}$/.test(item))return {region:'台湾身份证号',valid:frontTwIdValid(item)};
  return {region:'香港身份证号',valid:frontHkIdValid(item)};

async function askDeepSeek(step,answer,afterPosition){
  const record={...stepSnapshot(step),answer};
  const localId=isIdStep(step)?frontClassifyId(answer):null;
  if(localId?.valid){
    aiHistory.push({...record,decision:'continue',normalized_answer:localId.region});
    showAiNotice('身份证号已通过校验');
    return;
  }
  showAiNotice('AI 正在判断本步信息…');
  try{
    const response=await fetch('/api/judge',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({current:stepSnapshot(step),answer,history:aiHistory})
    });
    const result=await response.json();
    if(!result.connected){
      aiHistory.push({...record,decision:result.decision,normalized_answer:result.normalized_answer||''});
      showAiNotice(result.message||'AI 服务暂不可用，已按流程继续','warn');
      return;
    }
    const message=result.message||'已完成本步判断';
    if(result.decision==='need_human'){
      aiHistory.push({...record,decision:result.decision,normalized_answer:result.normalized_answer||''});
      const insertAt=Math.max(0,Math.min(afterPosition,queue.length));
      queue.splice(insertAt,0,human(`AI 判断：${message}`));
      position=insertAt;
      render();
      showAiNotice('AI 建议转人工确认','human');
      return;
    }
    if(result.decision==='need_clarify'){
      calcRecords.pop();
      if(afterPosition>0){position=afterPosition-1;answers.pop();render();}
      showAiNotice(`AI 提醒：${message}`,'warn');
      return;
    }
    aiHistory.push({...record,decision:result.decision,normalized_answer:result.normalized_answer||''});
    showAiNotice(result.message||'AI 判断通过，已进入下一步');
  }catch(error){
    aiHistory.push(record);
    showAiNotice('AI 判断暂不可用，已按流程继续','warn');
  }
}

  return `<div class="date-wheel" aria-label="${ariaLabel}">${wheelColumn(`${prefix}-year`,'年',wheelValues(2010,2040),defaultYear)}${wheelColumn(`${prefix}-month`,'月',wheelValues(1,12,true),defaultMonth)}${wheelColumn(`${prefix}-day`,'日',wheelValues(1,31,true),defaultDay)}</div>`;

function syncWheelList(list){
  const items=[...list.querySelectorAll('.wheel-item')];
  if(!items.length)return;
  const itemHeight=30;
  const index=Math.max(0,Math.min(items.length-1,Math.round(list.scrollTop/itemHeight)));
  const item=items[index];
  list.dataset.value=item.dataset.value;
  items.forEach(node=>node.classList.toggle('selected',node===item));

function initWheelLists(scope=document){
  scope.querySelectorAll('.wheel-list').forEach(list=>{
    const items=[...list.querySelectorAll('.wheel-item')];

    return {level:'mid',title:'优先看被告所在地法院',detail:`可优先考虑被告所在地法院；原告所在地可作为备选线索。${payTip}`};
  }

  if(plaintiff)return {level:'warn',title:'建议人工确认管辖',detail:'仅有原告所在地，缺少被告所在地，管辖判断不够稳。'};
  return {level:'warn',title:'暂不能判断管辖法院',detail:'请补充约定法院或被告所在地。'};
}
function moneyValue(text){
  const value=String(text||'').replace(/，/g,'').match(/(\d+(?:\.\d+)?)\s*(万)?\s*(?:元|人民币|RMB|¥)?/i);
  if(!value)return null;
  return Number(value[1])*(value[2]?10000:1);
}
function moneyValues(text){
  return [...String(text||'').replace(/，/g,'').matchAll(/(\d+(?:\.\d+)?)\s*(万)?\s*(?:元|人民币|RMB|¥)?/gi)]
    .map(match=>Number(match[1])*(match[2]?10000:1));
}
function dateValue(text){
  const raw=String(text||'').replace(/[年月.\/]/g,'-').replace(/日/g,'');
  const found=raw.match(/(20\d{2}|19\d{2})-(\d{1,2})-(\d{1,2})/);
  if(!found)return null;
  const date=new Date(Number(found[1]),Number(found[2])-1,Number(found[3]));
  return Number.isNaN(date.getTime())?null:date;
}
function dateValues(text){
  const raw=String(text||'').replace(/[年月.\/]/g,'-').replace(/日/g,'');
  return [...raw.matchAll(/(20\d{2}|19\d{2})-(\d{1,2})-(\d{1,2})/g)]
    .map(match=>new Date(Number(match[1]),Number(match[2])-1,Number(match[3])))
    .filter(date=>!Number.isNaN(date.getTime()));
}
function stripDates(text){
  return String(text||'').replace(/(20\d{2}|19\d{2})[年.\/-]\d{1,2}[月.\/-]\d{1,2}日?/g,' ');
}
function rateValue(text){
  const raw=String(text||'');
  const found=raw.match(/(\d+(?:\.\d+)?)\s*%/);
  if(!found)return null;
  const n=Number(found[1])/100;
  const daily=/日息|日利率|每日|\/日|天息|日/.test(raw);
  const monthly=/月息|月利率|每月|\/月|月/.test(raw);
  const annual=/年息|年利率|每年|\/年|年/.test(raw);
  if(daily)return {annual:n*365,label:`日息 ${Number(found[1])}%`};
  if(monthly)return {annual:n*12,label:`月息 ${Number(found[1])}%`};
  if(annual)return {annual:n,label:`年息 ${Number(found[1])}%`};
  return null;
}
function daysBetween(start,end){
  return Math.max(0,Math.round((end-start)/86400000));
}
function yuan(n){
  return `${Math.max(0,n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})} 元`;
}
const defaultLprAnnualRate=0.03;
function calcLogicText(calc){
  if(calc.noInterest)return `无约定利息时，从${calc.interestStartLabel}起按 LPR 一倍估算资金占用利息。`;
  if(calc.repaid>0&&calc.orderLabel.includes('先本'))return '已还款按约定先抵扣本金，剩余本金继续按约定利率计算利息。';
  if(calc.repaid>0)return '已还款先抵扣还款时已经产生的利息，剩余部分再抵扣本金，剩余本金继续计息。';
  return '按借款本金、约定利率和计算截止日作单利估算；最终以证据和法院认定为准。';
}
function repaymentItems(record){
  const text=String(record?.answer||'');
  if(!text)return [];
  const chunks=text.split(/[；;\n]+/).map(part=>part.trim()).filter(Boolean);
  const parsed=chunks.map(chunk=>{
    const amount=moneyValue(stripDates(chunk));
    const date=dateValue(chunk);
    return amount&&date?{amount,date}:null;
  }).filter(Boolean);
  if(parsed.length)return parsed.sort((a,b)=>a.date-b.date);
  const amounts=moneyValues(stripDates(text));
  const dates=dateValues(text);
  return amounts.map((amount,index)=>dates[index]?{amount,date:dates[index]}:null).filter(Boolean).sort((a,b)=>a.date-b.date);
}
function repaymentOrder(noInterest=false){
  if(noInterest)return {mode:'interestFirst',label:'资金占用利息，先息后本'};
  const answer=latestRecord('是否约定还款抵扣顺序')?.answer;
  if(answer==='先还本金')return {mode:'principalFirst',label:'先还本金'};
  if(answer==='先还利息')return {mode:'interestFirst',label:'先还利息'};
  return {mode:'interestFirst',label:'未约定，先息后本'};
}
function computeRepayment(){
  const missing=[];
  const principalRecord=latestRecord('借款本金总金额')||latestRecord('借款总金额');
  const principal=moneyValue(principalRecord?.answer);
  if(principal==null)missing.push('借款本金金额');
  const cutoff=dateValue((latestRecord('计算诉讼金额的截止时间')||latestRecord('计算截止日期'))?.answer);
  if(!cutoff)missing.push('计算诉讼金额的截止时间');
  const noInterest=latestRecord('是否约定利息')?.answer==='没有';
  const rateRecord=latestRecord('约定利息百分比');
  const dueDate=dateValue(latestRecord('约定还款日期')?.answer);
  const firstDemandDate=dateValue(latestRecord('第一次催要时间')?.answer);
  const rate=noInterest?{annual:defaultLprAnnualRate,label:`LPR一倍（暂按年化 ${(defaultLprAnnualRate*100).toFixed(2)}%）`}:rateValue(rateRecord?.answer);
  if(!noInterest&&!rate)missing.push('日息、月息或年息百分比');
  const loanDate=dateValue(latestRecord('借款日期')?.answer);
  let interestStart=loanDate;
  let interestStartLabel='借款日期';
  if(noInterest){
    interestStart=dueDate||firstDemandDate;
    interestStartLabel=dueDate?'约定还款日期':'第一次催要时间';
    if(!interestStart)missing.push('约定还款日期或第一次催要时间');
  }
  if(rate?.annual>0&&!interestStart)missing.push(noInterest?'资金占用利息起算时间':'借款日期');
  const repaymentChoice=latestRecord('是否已还款')?.answer;
  const repaymentRecord=latestRecord('已还款明细')||latestRecord('已还款情况')||latestRecord('已还款金额和时间')||latestRecord('已还款金额');
  const repayments=repaymentChoice==='没有还过'?[]:repaymentItems(repaymentRecord);
  const rawRepaid=moneyValues(stripDates(repaymentRecord?.answer)).reduce((sum,value)=>sum+value,0);
  if(repaymentChoice&&repaymentChoice!=='没有还过'&&!repayments.length)missing.push('每笔已还款金额和时间');
  if(missing.length)return {ok:false,missing};
  const baseStart=interestStart||cutoff;
  const order=repaymentOrder(noInterest);
  let principalBalance=principal;
  let unpaidInterest=0;
  let currentDate=baseStart;
  let overpay=0;
  let repaid=0;
  const accrueTo=(targetDate)=>{
    if(rate.annual>0){
      unpaidInterest+=principalBalance*rate.annual*daysBetween(currentDate,targetDate)/365;
    }
    currentDate=targetDate;
  };
  repayments.filter(item=>item.date<=cutoff).forEach(item=>{
    accrueTo(item.date<currentDate?currentDate:item.date);
    repaid+=item.amount;
    let payment=item.amount;
    if(order.mode==='principalFirst'){
      const principalPaid=Math.min(principalBalance,payment);
      principalBalance-=principalPaid;
      payment-=principalPaid;
      const interestPaid=Math.min(unpaidInterest,payment);
      unpaidInterest-=interestPaid;
      payment-=interestPaid;
    }else{
      const interestPaid=Math.min(unpaidInterest,payment);
      unpaidInterest-=interestPaid;
      payment-=interestPaid;
      const principalPaid=Math.min(principalBalance,payment);
      principalBalance-=principalPaid;
      payment-=principalPaid;
    }
    overpay+=payment;
  });
  accrueTo(cutoff);
  if(rawRepaid>0&&repaid===0)repaid=rawRepaid;
  const warning=overpay>0?'已还款可能已经覆盖本息，请核实是否存在多还或录入错误。':'';
  return {ok:true,principal,remainingPrincipal:principalBalance,repaid,interest:unpaidInterest,total:principalBalance+unpaidInterest,rateLabel:rate.label,orderLabel:order.label,warning,noInterest,interestStartLabel};
}
